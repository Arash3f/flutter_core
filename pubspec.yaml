name: flutter_core
description: "Core Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.35.0'


#--------------------------------------------#
#----------------Dependencies----------------#
#--------------------------------------------#

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # `any` is required: flutter_localizations pins an exact intl version.
  # Pinning it here would break resolution on every Flutter SDK upgrade.
  intl: any

  cupertino_icons: ^1.0.9

  #--------------State management & DI--------------#
  flutter_riverpod: ^3.4.2

  #--------------Storage--------------#
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  #--------------Localization--------------#
  easy_localization: ^3.0.8

  #--------------Utilities--------------#
  logger: ^2.7.0
  flutter_screenutil: ^5.9.3
  equatable: ^2.1.0
  flutter_native_splash: ^2.4.6

#--------------------------------------------#
#--------------Dev Dependencies--------------#
#--------------------------------------------#

dev_dependencies:
  flutter_lints: ^6.0.0

  # Loose bounds on purpose: these two share the `analyzer` dependency and
  # tight pins make `pub get` unsolvable whenever either one publishes.
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.4.0

#-------------------------------------------#
#--------------Native Splash----------------#
#-------------------------------------------#

flutter_native_splash:
  color: "#2563EB"
  color_dark: "#1D4ED8"
  android_12:
    color: "#2563EB"
    color_dark: "#1D4ED8"

#-------------------------------------------#
#------------------Flutter------------------#
#-------------------------------------------#

flutter:

  uses-material-design: true

  #--------------LOCAL ASSETS--------------#
  # Every directory listed here must exist on disk or `flutter pub get` fails.
  assets:
    - assets/images/
    - assets/icons/
    - assets/gif/
    - assets/translations/

  #--------------LOCAL FONTS--------------#
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-Medium.ttf
          weight: 500
    - family: IranSans
      fonts:
        - asset: assets/fonts/IranSans/IranSans.ttf
          weight: 500

#-----------------------------------------------------#
#--------------Third Party Configuration--------------#
#-----------------------------------------------------#

##--------------Flutter Gen--------------#
flutter_gen:
  output: lib/core/utils/gen
  line_length: 80

  # Integrations are only enabled for packages actually present in
  # `dependencies`; enabling one without its package generates code that
  # does not compile.
