name: flutter_core
description: "Core Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.35.0'


#--------------------------------------------#
#----------------Dependencies----------------#
#--------------------------------------------#

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # `any` is required: flutter_localizations pins an exact intl version.
  # Pinning it here would break resolution on every Flutter SDK upgrade.
  intl: any

  cupertino_icons: ^1.0.9

  #--------------State management & DI--------------#
  flutter_riverpod: ^3.4.2

  #--------------Storage--------------#
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  #--------------Localization--------------#
  easy_localization: ^3.0.8

  #--------------Network--------------#
  # REST and GraphQL ship side by side; delete the one your backend does not
  # speak, see lib/core/network/README.md.
  dio: ^5.8.0
  graphql_flutter: ^5.2.0
  # Only for the `http.Client` type `HttpLink` accepts (tests inject a fake).
  http: ^1.4.0

  #--------------Navigation--------------#
  go_router: ^15.1.2

  #--------------Utilities--------------#
  logger: ^2.7.0
  flutter_screenutil: ^5.9.3
  equatable: ^2.1.0
  flutter_native_splash: ^2.4.6

  #--------------Platform polish--------------#
  # Desktop only: minimum window size, title, centering. No-op elsewhere.
  window_manager: ^0.4.3

#--------------------------------------------#
#--------------Dev Dependencies--------------#
#--------------------------------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Loose bounds on purpose: these two share the `analyzer` dependency and
  # tight pins make `pub get` unsolvable whenever either one publishes.
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.4.0

  # Used by `tool/gen_icon.dart` and the launcher icon step below.
  image: ^4.5.4
  flutter_launcher_icons: ^0.14.3

#-------------------------------------------#
#--------------Native Splash----------------#
#-------------------------------------------#

flutter_native_splash:
  color: "#016DF1"
  color_dark: "#08090D"
  android_12:
    color: "#016DF1"
    color_dark: "#08090D"

#-------------------------------------------#
#--------------Launcher Icons---------------#
#-------------------------------------------#
# Brand assets live in assets/brand/ (Arash Alfooneh Ribbon A kit).
# 1. `dart run tool/gen_icon.dart`
# 2. `dart run flutter_launcher_icons`

flutter_launcher_icons:
  image_path: assets/icons/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#08090D"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  web:
    generate: true
    background_color: "#08090D"
    theme_color: "#016DF1"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

#-------------------------------------------#
#------------------Flutter------------------#
#-------------------------------------------#

flutter:

  uses-material-design: true

  #--------------LOCAL ASSETS--------------#
  # Every directory listed here must exist on disk or `flutter pub get` fails.
  assets:
    - assets/images/
    - assets/icons/
    - assets/brand/
    - assets/gif/
    - assets/translations/

  #--------------LOCAL FONTS--------------#
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-Medium.ttf
          weight: 500
    - family: IranSans
      fonts:
        - asset: assets/fonts/IranSans/IranSans.ttf
          weight: 500

#-----------------------------------------------------#
#--------------Third Party Configuration--------------#
#-----------------------------------------------------#

##--------------Flutter Gen--------------#
flutter_gen:
  output: lib/core/utils/gen
  line_length: 80

  # Integrations are only enabled for packages actually present in
  # `dependencies`; enabling one without its package generates code that
  # does not compile.
