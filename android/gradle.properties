org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# Avoid Kotlin compile daemon (it often fails to bind on localhost here).
kotlin.compiler.execution.strategy=in-process
# Incremental caches on this Windows setup fail to close (.tab locks); full
# recompiles are slower but reliable.
kotlin.incremental=false
kotlin.incremental.java=false
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
android.useAndroidX=true
# Jetifier rewrites legacy support-library bytecode. No dependency here needs
# it, and leaving it on slows every build down.
android.enableJetifier=false
# Built-in Kotlin (AGP 9+): app no longer applies kotlin-android.
android.builtInKotlin=true
# Flutter Gradle Plugin still reads the legacy AGP DSL; keep this until Flutter
# finishes its own new-DSL migration (issue #180137 / #184839).
android.newDsl=false
